[package]
name = "mtg-edh-mcp-acceptance"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

[dependencies]
anyhow = "1"
rmcp = { version = "=3.2.0", default-features = false, features = ["client", "transport-async-rw"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "time"] }
