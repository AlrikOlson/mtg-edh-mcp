[package]
name = "mtg-edh-mcp-client"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Typed async Rust client over the mtg-edh-mcp engine's streamable-HTTP MCP surface."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# Native transport: the official Rust MCP SDK (client role, streamable-HTTP,
# reqwest-backed). from_config lets us attach the x-mcp-principal header via
# custom_headers and set allow_stateless=true (the engine is stateless POST-only).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rmcp = { version = "2", features = [
    "client",
    "transport-streamable-http-client",
    "transport-streamable-http-client-reqwest",
    "transport-child-process",
] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process"] }
# Header types for custom_headers (HashMap<HeaderName, HeaderValue>); rmcp re-uses http 1.x.
http = "1"

# wasm transport (gui-scrutiny web target): the engine accepts a DIRECT stateless
# JSON-RPC tools/call POST (no initialize, no session — curl-verified think:140),
# so the browser build needs only fetch-backed reqwest, not rmcp.
[target.'cfg(target_arch = "wasm32")'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json"] }

[dev-dependencies]
# Integration test spawns the node engine and round-trips a call.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time", "io-util"] }
