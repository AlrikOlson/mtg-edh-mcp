[application]
name = "mtg-edh-gui"

[bundle]
identifier = "dev.alrik.mtg-edh"
publisher = "alrik"
# The engine sidecar (Node SEA binary + its native sqlite addon), built by
# scripts/package-engine.sh at the repo root. Both land in Contents/MacOS
# next to the app binary; state.rs resolves them as siblings of current_exe.
external_bin = [
    "../../build/mtg-edh-engine",
    "../../build/better_sqlite3.node",
]
# The card-data snapshot → Contents/Resources/data/cards.
resources = ["bundle-data/**/*"]
