[package]
name = "mtg-edh-gui"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Desktop GUI for mtg-edh-mcp — a Dioxus client over the MCP engine."

[dependencies]
# Dioxus 0.7 with the desktop renderer enabled explicitly. `dx` (dioxus-cli)
# would pick the platform feature for us, but we gate on plain `cargo build`
# (dioxus-cli isn't required to compile, and its `dx` binary name collides with
# Deno's `dx` on this machine — see the ADR). System WebView via wry/tao.
dioxus = { version = "0.7", features = ["desktop"] }
