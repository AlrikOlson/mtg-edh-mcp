# Rust workspace for the mtg-edh-mcp GUI (Phase G).
#
# Self-contained under /gui so cargo never scans the TypeScript engine at the
# repo root — the two toolchains (cargo + npm) stay cleanly separated. See
# ../docs/adr/0001-gui-architecture.md for the architecture decision.
[workspace]
resolver = "2"
members = ["app"]

[workspace.package]
edition = "2021"
license = "MIT"
rust-version = "1.85"
