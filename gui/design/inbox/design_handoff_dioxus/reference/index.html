<!-- REFERENCE COPY of ui_kits/manabase/index.html — the runnable prototype lives in the design-system project. Sibling .jsx files are shipped as .jsx.txt so they read as documentation. -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Manabase — Commander Deckbuilding Workbench</title>
<link rel="icon" href="../../assets/logo/favicon.svg" />
<link rel="stylesheet" href="../../styles.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/mana-font@1.18.0/css/mana.css" />
<style>
  html, body { height: 100%; }
  body { margin: 0; background: var(--surface-canvas); }
  #root { height: 100vh; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<script src="data.js"></script>
<script src="agent-script.js"></script>
<script src="icons.jsx" type="text/babel" data-presets="react"></script>
<script src="CardBrowser.jsx" type="text/babel" data-presets="react"></script>
<script src="DeckEditor.jsx" type="text/babel" data-presets="react"></script>
<script src="InsightsCards.jsx" type="text/babel" data-presets="react"></script>
<script src="AnalysisDashboard.jsx" type="text/babel" data-presets="react"></script>
<script src="Collection.jsx" type="text/babel" data-presets="react"></script>
<script src="app.jsx" type="text/babel" data-presets="react"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
  // The component bundle (_ds_bundle.js) is generated by the compiler at the end
  // of a turn. Wait for it + the Babel-transpiled module globals; if it isn't
  // available yet, show a friendly notice instead of a blank screen.
  var shownFallback = false;
  function ready() {
    return window.ManabaseDesignSystem_9d5890 && window.ManabaseApp &&
      window.CardBrowser && window.DeckEditor &&
      window.Collection && window.Ic && window.MB_AGENT && window.InsightsRail && window.InsightsCards;
  }
  function fallback() {
    document.getElementById("root").innerHTML =
      '<div style="height:100vh;display:flex;flex-direction:column;align-items:center;' +
      'justify-content:center;gap:14px;color:var(--text-muted);font-family:var(--font-sans);text-align:center">' +
      '<img src="../../assets/logo/manabase-mark.svg" style="width:52px;height:52px;opacity:.8"/>' +
      '<div style="font-family:var(--font-display);font-size:22px;color:var(--text-secondary)">Loading the workbench…</div>' +
      '<div style="font-size:13px">Compiling components. This clears on its own.</div></div>';
  }
  function mount() {
    if (ready()) {
      var r = document.getElementById("root");
      r.innerHTML = "";
      ReactDOM.createRoot(r).render(<window.ManabaseApp />);
    } else {
      if (!shownFallback) { fallback(); shownFallback = true; }
      setTimeout(mount, 60);
    }
  }
  mount();
</script>
</body>
</html>
