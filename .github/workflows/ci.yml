name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: Node ${{ matrix.node }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: ["22.13.0", "24", "26"]
        include:
          - os: macos-latest
            node: "24"
          - os: windows-latest
            node: "24"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run lint
      - name: Pack, install, and exercise the real stdio server
        run: npm run test:package
      - name: Install Rust acceptance toolchain
        if: matrix.os == 'ubuntu-latest' && matrix.node == '24'
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Check Rust client and exercise SDK interoperability
        if: matrix.os == 'ubuntu-latest' && matrix.node == '24'
        env:
          RUSTUP_TOOLCHAIN: stable
        run: |
          npm run lint:rust
          npm run test:rust
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=moderate
